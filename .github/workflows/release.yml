name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-22.04
            asset_name: opcua-studio-linux-amd64
          - name: windows-amd64
            runner: windows-latest
            asset_name: opcua-studio-windows-amd64.exe
          - name: darwin-amd64
            runner: macos-13
            asset_name: opcua-studio-darwin-amd64.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build app
        run: wails build

      - name: Stage release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          case "${{ runner.os }}" in
            Linux)
              cp build/bin/opcua-studio "release/${{ matrix.asset_name }}"
              ;;
            Windows)
              cp build/bin/opcua-studio.exe "release/${{ matrix.asset_name }}"
              ;;
            macOS)
              ditto -c -k --sequesterRsrc --keepParent build/bin/opcua-studio.app "release/${{ matrix.asset_name }}"
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish release with checksums
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%P\0' \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
